[project]
name = "v0-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "my-temporary-name", email = "ankityadav123774@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
v0-code = "v0_code:main"
v0-plot = "v0_code.viz.plots:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
